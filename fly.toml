# fly.toml app configuration file generated for personal-website-xg4qwq on 2026-07-21T16:51:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'personal-website-xg4qwq'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
