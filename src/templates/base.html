<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">

  <!-- Open Graph — controls how links look when shared on Slack, Twitter, iMessage, etc. -->
  <meta property="og:title"       content="{% block og_title %}{{ site.title }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ site.description }}{% endblock %}">
  <meta property="og:image"       content="{% block og_image %}{{ site.url }}/assets/img/og-default.jpg{% endblock %}">
  <meta property="og:url"         content="{{ site.url }}{% block og_url %}{% endblock %}">
  <meta property="og:type"        content="{% block og_type %}website{% endblock %}">
  <meta property="og:site_name"   content="{{ site.title }}">

  <!-- Twitter / X card -->
  <meta name="twitter:card"    content="summary_large_image">
  <meta name="twitter:creator" content="@{{ site.author.twitter }}">

  <!-- Canonical URL tells Google which page is authoritative when duplicates exist -->
  <link rel="canonical" href="{{ site.url }}{% block canonical %}{% endblock %}">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Fonts: Playfair Display (editorial serif) + Inter (clean sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Structured data (JSON-LD): machine-readable metadata Google uses for rich results -->
  {% block jsonld %}{% endblock %}
</head>
<body>

  <nav id="site-nav" aria-label="Primary navigation">
    <a href="/" class="nav-logo">Wesley Gilbert</a>
    <button id="theme-toggle" type="button" aria-label="Switch color theme">
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z" />
      </svg>
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
  </nav>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
